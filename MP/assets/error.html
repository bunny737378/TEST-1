<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Available</title>
    <style>
        /* 基本的なスタイルリセット */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            background-color: #f8f9fa;
        }

        /* コンテンツを画面の中央に配置するためのコンテナ */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100%;
            padding: 64px;
            box-sizing: border-box;
        }

        /* エラーメッセージのタイトル */
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 10px;
            color: #e74c3c;
            /* エラーを示す赤色 */
        }

        /* エラーの詳細説明 */
        p {
            font-size: 16px;
            margin: 0 0 25px;
            color: #555;
            max-width: 400px;
        }

        /* ボタンにマウスカーソルが乗った時のスタイル */
        .retry-button:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Page Not Available</h1>
        <p>
            We're sorry, the page you requested could not be loaded. Please check your network connection and try again.
        </p>
    </div>

</body>

</html>
