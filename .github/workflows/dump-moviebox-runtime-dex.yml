name: Dump MovieBox runtime DEX for authorized analysis

on:
  push:
    branches:
      - 'arena/6e9de998-test-1'
    paths:
      - '.github/workflows/dump-moviebox-runtime-dex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    if: github.ref == 'refs/heads/arena/6e9de998-test-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the current branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download the upstream APK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/moviebox-input" "$RUNNER_TEMP/moviebox-dexdump"
          echo 'Downloading MovieBox APK.'
          curl --fail --location --retry 3 --silent --show-error \
            --proto '=http,https' --proto-redir '=http,https' \
            --connect-timeout 30 --max-time 600 \
            'https://apk.aoneroom.com/apk/moviebox/release/4.0.04.1112.03/1637_protected_signed/moviebox-v-4.0.04.1112.03.apk' \
            --output "$RUNNER_TEMP/moviebox-input/moviebox.apk"
          python3 - <<'PY'
          import hashlib
          import os
          import zipfile
          from pathlib import Path
          apk = Path(os.environ['RUNNER_TEMP']) / 'moviebox-input/moviebox.apk'
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              if 'AndroidManifest.xml' not in names:
                  raise SystemExit('APK manifest is missing')
              dexes = [n for n in names if n == 'classes.dex' or
                       (n.startswith('classes') and n.endswith('.dex'))]
              print('APK bytes:', apk.stat().st_size)
              print('APK SHA-256:', hashlib.sha256(apk.read_bytes()).hexdigest())
              print('Packaged DEX entries:', dexes)
              for name in dexes:
                  data = z.read(name)
                  print(name, 'size=', len(data), 'header=', data[:8].hex())
          PY

      - name: Install Frida DEX dumper
        run: python3 -m pip install --disable-pip-version-check frida-tools frida-dexdump

      - name: Boot emulator and dump loaded DEX
        id: runtime_dump
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 240
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          pre-emulator-launch-script: |
            mkdir -p "$RUNNER_TEMP"
            echo "AVD setup started for run $GITHUB_RUN_ID at $(date -u +%FT%TZ)" \
              | tee -a "$RUNNER_TEMP/moviebox-runtime.log"
          script: |
            exec > >(tee -a "$RUNNER_TEMP/moviebox-runtime.log") 2>&1
            set -euxo pipefail
            echo "Emulator script started at $(date -u +%FT%TZ)."
            timeout 90s adb root
            timeout 90s adb wait-for-device

            booted=0
            for attempt in $(seq 1 60); do
              boot_state="$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              echo "Emulator boot poll ${attempt}/60: ${boot_state:-not-ready}"
              if [[ "$boot_state" == 1 ]]; then booted=1; break; fi
              sleep 2
            done
            if [[ "$booted" != 1 ]]; then
              echo 'Emulator failed to boot within 120 seconds.'
              timeout 10s adb logcat -d -t 200 || true
              exit 1
            fi

            frida_version="$(python3 -c 'import frida; print(frida.__version__)')"
            server="$RUNNER_TEMP/frida-server.xz"
            echo "Fetching matching Frida server ${frida_version}."
            curl --fail --location --retry 2 --silent --show-error \
              --connect-timeout 20 --max-time 180 \
              "https://github.com/frida/frida/releases/download/${frida_version}/frida-server-${frida_version}-android-x86_64.xz" \
              --output "$server"
            xz --decompress --force "$server"
            timeout 60s adb push "$RUNNER_TEMP/frida-server" /data/local/tmp/frida-server
            timeout 30s adb shell chmod 755 /data/local/tmp/frida-server
            timeout 30s adb shell 'nohup /data/local/tmp/frida-server >/dev/null 2>&1 &'

            frida_ready=0
            for attempt in $(seq 1 20); do
              if timeout 10s frida-ps -U >/dev/null 2>&1; then
                frida_ready=1
                break
              fi
              echo "Waiting for Frida server (${attempt}/20)."
              sleep 2
            done
            if [[ "$frida_ready" != 1 ]]; then
              echo 'Frida server did not become ready within 40 seconds.'
              timeout 10s adb shell ps -A | grep -i frida || true
              timeout 10s adb logcat -d -t 200 || true
              exit 1
            fi

            echo 'Installing the upstream app and starting bounded DEX dump.'
            timeout 120s adb install -r "$RUNNER_TEMP/moviebox-input/moviebox.apk"
            timeout 240s frida-dexdump -U -f com.community.oneroom \
              -o "$RUNNER_TEMP/moviebox-dexdump" --sleep 15 --deep-search

            python3 - <<'PY'
            import os
            from pathlib import Path
            root = Path(os.environ['RUNNER_TEMP']) / 'moviebox-dexdump'
            dexes = sorted(root.rglob('*.dex'))
            if not dexes:
                raise SystemExit('Frida attached but did not produce any DEX dumps.')
            for dex in dexes:
                data = dex.read_bytes()
                print(f'{dex.name}: {len(data)} bytes; header={data[:8].hex()}')
            with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                summary.write(f'Runtime DEX files dumped: **{len(dexes)}**.\n')
            PY

      - name: Persist emulator diagnostics to the branch
        if: always()
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/moviebox-runtime.log"
          if [[ ! -s "$log" ]]; then
            echo 'No emulator script log was produced; check the emulator step in Actions UI.'
            exit 0
          fi
          report="reports/moviebox-runtime-${GITHUB_RUN_ID}.log"
          mkdir -p reports
          cp "$log" "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$report"
          git commit -m "Save MovieBox runtime dump diagnostics"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Upload runtime DEX dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MovieBox-runtime-dex-dumps
          path: ${{ runner.temp }}/moviebox-dexdump/**/*.dex
          if-no-files-found: warn
          retention-days: 3

      - name: Fail if runtime DEX dump failed
        if: steps.runtime_dump.outcome == 'failure'
        run: exit 1
