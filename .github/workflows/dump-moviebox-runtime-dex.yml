name: Dump MovieBox runtime DEX for authorized analysis

on:
  push:
    branches:
      - 'arena/6e9de998-test-1'
    paths:
      - '.github/workflows/dump-moviebox-runtime-dex.yml'
  workflow_dispatch:

concurrency:
  group: moviebox-runtime-dex-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dump:
    if: github.ref == 'refs/heads/arena/6e9de998-test-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the current branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download the upstream APK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/moviebox-input" "$RUNNER_TEMP/moviebox-dexdump"
          echo 'Downloading MovieBox APK.'
          curl --fail --location --retry 3 --silent --show-error \
            --proto '=http,https' --proto-redir '=http,https' \
            --connect-timeout 30 --max-time 600 \
            'https://apk.aoneroom.com/apk/moviebox/release/4.0.04.1112.03/1637_protected_signed/moviebox-v-4.0.04.1112.03.apk' \
            --output "$RUNNER_TEMP/moviebox-input/moviebox.apk"
          python3 - <<'PY'
          import hashlib
          import os
          import zipfile
          from pathlib import Path
          apk = Path(os.environ['RUNNER_TEMP']) / 'moviebox-input/moviebox.apk'
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              if 'AndroidManifest.xml' not in names:
                  raise SystemExit('APK manifest is missing')
              dexes = [n for n in names if n == 'classes.dex' or
                       (n.startswith('classes') and n.endswith('.dex'))]
              print('APK bytes:', apk.stat().st_size)
              print('APK SHA-256:', hashlib.sha256(apk.read_bytes()).hexdigest())
              print('Packaged DEX entries:', dexes)
              for name in dexes:
                  data = z.read(name)
                  print(name, 'size=', len(data), 'header=', data[:8].hex())
          PY

      - name: Install Frida DEX dumper
        run: python3 -m pip install --disable-pip-version-check frida-tools frida-dexdump

      - name: Boot emulator and dump loaded DEX
        id: runtime_dump
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p reports "$RUNNER_TEMP/moviebox-dexdump"
          log="$GITHUB_WORKSPACE/reports/moviebox-runtime-${GITHUB_RUN_ID}.log"
          exec > >(tee -a "$log") 2>&1
          trap 'if [[ -n "${emulator_pid:-}" ]]; then kill "$emulator_pid" 2>/dev/null || true; fi' EXIT
          echo "Runtime dump started at $(date -u +%FT%TZ), run $GITHUB_RUN_ID."
          echo "Runner: $(uname -a)"
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo '/dev/kvm: readable and writable; emulator acceleration enabled.'
          else
            echo '/dev/kvm: unavailable; emulator will use automatic acceleration fallback.'
          fi
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          if [[ -z "${ANDROID_HOME:-}" ]]; then echo 'ANDROID_HOME is not set on this runner.'; exit 1; fi
          for tool_bin in "$ANDROID_HOME"/cmdline-tools/*/bin; do
            [[ -d "$tool_bin" ]] && PATH="$tool_bin:$PATH"
          done
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          command -v sdkmanager

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0
          timeout 600s sdkmanager --install \
            'platform-tools' 'emulator' 'system-images;android-30;google_atd;x86_64'
          command -v emulator
          command -v avdmanager
          echo no | avdmanager create avd --force -n moviebox-runtime \
            -k 'system-images;android-30;google_atd;x86_64' -d pixel_2
          echo 'AVD created; launching emulator.'
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | tee -a "$log"
          "$ANDROID_HOME/emulator/emulator" -avd moviebox-runtime -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel auto -wipe-data >> "$log" 2>&1 &
          emulator_pid=$!
          echo "Emulator PID: $emulator_pid"

          serial=emulator-5554
          if ! timeout 45s adb -s "$serial" wait-for-device; then
            echo 'ADB did not see the emulator within 45 seconds.'
            tail -n 200 "$log" || true
            exit 1
          fi
          echo 'ADB transport connected; waiting at most 300 seconds for Android boot.'
          deadline=$((SECONDS + 300))
          booted=0
          poll=0
          while (( SECONDS < deadline )); do
            poll=$((poll + 1))
            boot_state="$(timeout 8s adb -s "$serial" shell getprop sys.boot_completed 2>&1 | tr -d '\r' || true)"
            echo "Boot poll ${poll}: ${boot_state:-not-ready}"
            if [[ "$boot_state" == 1 ]]; then booted=1; break; fi
            sleep 3
          done
          if [[ "$booted" != 1 ]]; then
            echo 'Android did not report sys.boot_completed=1 before the 300-second deadline.'
            timeout 10s adb -s "$serial" logcat -d -t 200 || true
            tail -n 250 "$log" || true
            exit 1
          fi

          timeout 30s adb -s "$serial" root
          timeout 45s adb -s "$serial" wait-for-device
          frida_version="$(python3 -c 'import frida; print(frida.__version__)')"
          server="$RUNNER_TEMP/frida-server.xz"
          echo "Fetching matching Frida server ${frida_version}."
          curl --fail --location --retry 2 --silent --show-error \
            --connect-timeout 20 --max-time 180 \
            "https://github.com/frida/frida/releases/download/${frida_version}/frida-server-${frida_version}-android-x86_64.xz" \
            --output "$server"
          xz --decompress --force "$server"
          timeout 60s adb -s "$serial" push "$RUNNER_TEMP/frida-server" /data/local/tmp/frida-server
          timeout 30s adb -s "$serial" shell chmod 755 /data/local/tmp/frida-server
          timeout 30s adb -s "$serial" shell 'nohup /data/local/tmp/frida-server >/dev/null 2>&1 &'

          frida_ready=0
          for attempt in $(seq 1 20); do
            if timeout 10s frida-ps -U >/dev/null 2>&1; then
              frida_ready=1
              break
            fi
            echo "Waiting for Frida server (${attempt}/20)."
            sleep 2
          done
          if [[ "$frida_ready" != 1 ]]; then
            echo 'Frida server did not become ready within 40 seconds.'
            timeout 10s adb -s "$serial" shell ps -A | grep -i frida || true
            timeout 10s adb -s "$serial" logcat -d -t 200 || true
            exit 1
          fi

          echo 'Installing the upstream app and starting bounded DEX dump.'
          timeout 120s adb -s "$serial" install -r "$RUNNER_TEMP/moviebox-input/moviebox.apk"
          timeout 240s frida-dexdump -U -f com.community.oneroom \
            -o "$RUNNER_TEMP/moviebox-dexdump" --sleep 15 --deep-search

          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'moviebox-dexdump'
          dexes = sorted(root.rglob('*.dex'))
          if not dexes:
              raise SystemExit('Frida attached but did not produce any DEX dumps.')
          for dex in dexes:
              data = dex.read_bytes()
              print(f'{dex.name}: {len(data)} bytes; header={data[:8].hex()}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('Runtime DEX files dumped: **' + str(len(dexes)) + '**.' + chr(10))
          PY

      - name: Persist emulator diagnostics to the branch
        if: always()
        run: |
          set -euo pipefail
          log="reports/moviebox-runtime-${GITHUB_RUN_ID}.log"
          if [[ ! -s "$log" ]]; then
            echo 'No emulator log was produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$log"
          git commit -m "Save MovieBox runtime dump diagnostics"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Upload runtime DEX dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MovieBox-runtime-dex-dumps
          path: ${{ runner.temp }}/moviebox-dexdump/**/*.dex
          if-no-files-found: warn
          retention-days: 3

      - name: Fail if runtime DEX dump failed
        if: steps.runtime_dump.outcome == 'failure'
        run: exit 1
