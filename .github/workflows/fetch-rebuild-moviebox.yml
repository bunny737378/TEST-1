name: Fetch, decompile, and rebuild MovieBox

on:
  push:
    branches:
      - 'arena/6e9de998-test-1'
    paths:
      - '.github/workflows/fetch-rebuild-moviebox.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    if: github.ref == 'refs/heads/arena/6e9de998-test-1'
    uses: ./.github/workflows/decompile-apk.yml
    with:
      apk_url: 'https://apk.aoneroom.com/apk/moviebox/release/4.0.04.1112.03/1637_protected_signed/moviebox-v-4.0.04.1112.03.apk'
      folder_name: MovieBox

  rebuild:
    needs: decompile
    uses: ./.github/workflows/rebuild-apk.yml
    with:
      folder_name: ${{ needs.decompile.outputs.folder_name }}
    secrets: inherit
