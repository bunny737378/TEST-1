name: Decompile Flutter SO Files

on:
  workflow_dispatch:
    inputs:
      app_folder:
        description: 'Decompiled APK folder name in repo (e.g., MyApp)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  decompile-so:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify target folder and SO files
        id: check_files
        env:
          APP_FOLDER: ${{ inputs.app_folder }}
        run: |
          set -euo pipefail
          LIB_DIR="$APP_FOLDER/lib/arm64-v8a"
          
          if [[ ! -d "$LIB_DIR" ]]; then
            echo "::error::Directory '$LIB_DIR' nahi mila! Check karein ki folder name sahi hai aur APK mein arm64-v8a libraries hain."
            exit 1
          fi

          if [[ ! -f "$LIB_DIR/libapp.so" || ! -f "$LIB_DIR/libflutter.so" ]]; then
            echo "::error::'$LIB_DIR' ke andar libapp.so ya libflutter.so missing hai. Yeh shayad Flutter app nahi hai."
            exit 1
          fi

          echo "lib_dir=$LIB_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies for Blutter
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools python3-requests git cmake ninja-build \
            build-essential pkg-config libicu-dev libcapstone-dev

      - name: Clone Blutter
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com "$RUNNER_TEMP/blutter"

      - name: Run Blutter on libapp.so
        env:
          LIB_DIR: ${{ steps.check_files.outputs.lib_dir }}
          APP_FOLDER: ${{ inputs.app_folder }}
        run: |
          set -euo pipefail
          OUT_DIR="$APP_FOLDER/blutter_output"
          mkdir -p "$OUT_DIR"
          
          python3 "$RUNNER_TEMP/blutter/blutter.py" "$LIB_DIR" "$OUT_DIR"

      - name: Commit and push decompiled Dart dump
        env:
          APP_FOLDER: ${{ inputs.app_folder }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          
          git add "$APP_FOLDER/blutter_output"
          if git diff --staged --quiet; then
            echo "Koi naya change commit karne ke liye nahi hai."
          else
            git commit -m "Decompile Flutter SO files for $APP_FOLDER"
            git push
          fi
