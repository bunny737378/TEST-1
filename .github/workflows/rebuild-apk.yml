name: Rebuild and Sign APK

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:
    inputs:
      folder_name:
        description: Name of the decompiled app folder
        required: true
        type: string
  workflow_call:
    inputs:
      folder_name:
        required: true
        type: string
    secrets:
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true

permissions:
  contents: read

env:
  # The folder rebuilt automatically on every push. Manual runs can still build
  # any decompiled Apktool project by passing a different folder_name.
  DEFAULT_PUSH_FOLDER: MOVIEN

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Validate the app folder
        id: folder
        env:
          APP_FOLDER: ${{ inputs.folder_name }}
          DEFAULT_PUSH_FOLDER: ${{ env.DEFAULT_PUSH_FOLDER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          name = os.environ['APP_FOLDER'].strip()
          if not name:
              if os.environ['GITHUB_EVENT_NAME'] != 'push':
                  raise SystemExit('folder_name is required for manual runs.')
              name = os.environ['DEFAULT_PUSH_FOLDER'].strip()
              if not name:
                  raise SystemExit('DEFAULT_PUSH_FOLDER is empty.')
              if not (workspace / name / 'apktool.yml').is_file():
                  raise SystemExit(
                      f'Push builds expect the {name} Apktool project in this branch.')
              print(f'Push build: rebuilding {name}')

          forbidden = set('/\\:*?"<>|')
          reserved = {'CON', 'PRN', 'AUX', 'NUL'} | {
              f'{prefix}{number}' for prefix in ('COM', 'LPT') for number in range(1, 10)
          }
          if (not name or name.startswith(('.', '-')) or name.endswith(('.', ' '))
                  or len(name.encode('utf-8')) > 200
                  or not all(c.isprintable() and c not in forbidden for c in name)
                  or name.split('.', 1)[0].upper() in reserved):
              raise SystemExit('Enter a safe folder name, not a path.')

          folder = workspace / name
          if folder.is_symlink() or not folder.is_dir() or not (folder / 'apktool.yml').is_file():
              raise SystemExit(f'{name!r} is not a decompiled Apktool project in this branch.')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'name={name}\n')
          print(f'Building app folder: {name}')
          PY

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare and validate the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::$secret is missing."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing-key.jks"
          test -s "$RUNNER_TEMP/signing-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/signing-key.jks" \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null

      - name: Download Apktool 3.0.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar' \
            --output "$RUNNER_TEMP/apktool.jar"
          printf '%s  %s\n' \
            'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423' \
            "$RUNNER_TEMP/apktool.jar" | sha256sum --check
          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Locate Android Build Tools
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          if [[ ! -x "$build_tools/zipalign" || ! -x "$build_tools/apksigner" ]]; then
            echo '::error::Android Build Tools 36.0.0 are not available.'
            exit 1
          fi
          echo "BUILD_TOOLS=$build_tools" >> "$GITHUB_ENV"

      - name: Rebuild the APK
        env:
          APP_FOLDER: ${{ steps.folder.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-work"
          # Keep the last lines of the build log so a failure is reported as an
          # annotation instead of an unreadable log dump.
          if ! java -jar "$RUNNER_TEMP/apktool.jar" build "$APP_FOLDER" \
            --output "$RUNNER_TEMP/apk-work/unsigned.apk" \
            > "$RUNNER_TEMP/apk-work/build.log" 2>&1; then
            tail_output="$(tail -n 30 "$RUNNER_TEMP/apk-work/build.log" | tr '\n' ' ')"
            echo "::error::Apktool build failed: ${tail_output//$'\r'/ }"
            exit 1
          fi
          tail -n 20 "$RUNNER_TEMP/apk-work/build.log" || true
          test -s "$RUNNER_TEMP/apk-work/unsigned.apk"
          unzip -tq "$RUNNER_TEMP/apk-work/unsigned.apk"

      - name: Align the APK
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 \
            "$RUNNER_TEMP/apk-work/unsigned.apk" "$RUNNER_TEMP/apk-work/aligned.apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$RUNNER_TEMP/apk-work/aligned.apk"

      - name: Sign the APK with the custom key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_FOLDER: ${{ steps.folder.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signed-apk"
          signed_apk="$RUNNER_TEMP/signed-apk/${APP_FOLDER}-signed.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/signing-key.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$signed_apk" \
            "$RUNNER_TEMP/apk-work/aligned.apk"
          test -s "$signed_apk"

      - name: Verify the signed APK
        env:
          APP_FOLDER: ${{ steps.folder.outputs.name }}
        run: |
          set -euo pipefail
          signed_apk="$RUNNER_TEMP/signed-apk/${APP_FOLDER}-signed.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$signed_apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$signed_apk"
          unzip -tq "$signed_apk"
          sha256sum "$signed_apk"
          printf 'Signed APK: %s-signed.apk\n' "$APP_FOLDER" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload only the signed APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/signed-apk/*-signed.apk
          if-no-files-found: error
          archive: false

      - name: Remove the temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-key.jks"