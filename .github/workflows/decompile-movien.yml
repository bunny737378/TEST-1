name: Refresh MOVIEN from the official APK

# One-shot refresh of the MOVIEN source tree, in the order it was done by
# hand: download the published APK, remove the signature verification, put the
# decompilation in MOVIEN/, run the patch scripts, build and sign.
#
#   apk_url ........ direct download link of the original, signed APK
#   dry_run ........ download, decode and compare, then stop: nothing in the
#                    branch is touched (use it to check a new upload first)
#   force_replace .. replace MOVIEN/ even when files the patch scripts do not
#                    own differ; by default that aborts, because it means the
#                    download is not the build this branch was cut from
#
# The compare step is the point of this workflow: MOVIEN/ must stay a faithful
# decompilation of the official APK plus exactly the files .rebuild owns, and
# anything else that differs is reported instead of committed.
#
# Apktool M (Android only, so it cannot run here) was used by hand with exactly
# two options ticked: "Remove signature verification" and "Replacing checksums
# from the original". Both are reproduced on the smali by
# .rebuild/signature_kill.py, which owns that part of the build. The value the
# unticked "Take a signature from the specified original" would have injected is
# still read off the download and recorded in the run summary and the commit
# message, so it is on file if the backend ever demands it.

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct HTTP(S) download link of the original APK
        required: false
        type: string
        default: https://app.r2c7a0.com/version/moviein/moviein_sh_3000-5.0.0.apk
      dry_run:
        description: Compare only, do not change or build anything
        type: boolean
        default: false
      force_replace:
        description: Replace MOVIEN/ even if unexpected files differ
        type: boolean
        default: false
  # A workflow_dispatch run needs the file on the default branch before GitHub
  # offers it, so this trigger is how a feature branch can exercise the refresh
  # at all - and a push run is always compare-only, never a replacement. It
  # fires when the patch scripts change, which is exactly when it is worth
  # re-checking that MOVIEN/ is still the official decompile plus those edits.
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/decompile-movien.yml'
      - '.rebuild/**'
      - 'MOVIEN/apktool.yml'

permissions:
  contents: write

# A refresh and the build it triggers must not fight over MOVIEN/.
concurrency:
  group: refresh-movien-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_FOLDER: MOVIEN
  DEFAULT_APK_URL: https://app.r2c7a0.com/version/moviein/moviein_sh_3000-5.0.0.apk
  EXPECTED_PACKAGE: com.fvvcl.flickverse
  EXPECTED_VERSION_NAME: 5.0.0
  APKTOOL_URL: https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
  APKTOOL_SHA256: dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Read the run options
        env:
          APK_URL: ${{ inputs.apk_url }}
          DEFAULT_APK_URL: ${{ env.DEFAULT_APK_URL }}
        run: |
          set -euo pipefail
          # workflow_dispatch renders booleans as "true"/"false", or as an
          # empty string when a caller omits them, so normalise here instead of
          # comparing types inside step conditions.
          dry=0
          force=0
          case '${{ inputs.dry_run }}' in true|True|1) dry=1 ;; esac
          case '${{ inputs.force_replace }}' in true|True|1) force=1 ;; esac
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # A push only ever asks the question: is MOVIEN/ still this APK plus
            # the .rebuild edits? Never rewrite the branch from a push.
            dry=1
            force=0
          fi
          {
            echo "DRY_RUN=$dry"
            echo "FORCE_REPLACE=$force"
            printf 'APK_URL=%s\n' "${APK_URL:-$DEFAULT_APK_URL}"
          } >> "$GITHUB_ENV"
          echo "event: $GITHUB_EVENT_NAME | replace MOVIEN/: $([[ $dry == 0 ]] && echo yes || echo no) | force: $force"


      - name: Check out the selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Apktool 3.0.3
        run: |
          set -euo pipefail
          # MOVIEN/apktool.yml says this project was written by 3.0.3; another
          # version would rewrite most files in the tree for no reason and the
          # compare step would rightly refuse the refresh.
          curl --fail --location --retry 3 --silent --show-error \
            "$APKTOOL_URL" --output "$RUNNER_TEMP/apktool.jar"
          printf '%s  %s\n' "$APKTOOL_SHA256" "$RUNNER_TEMP/apktool.jar" \
            | sha256sum --check
          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Locate Android Build Tools
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          if [[ ! -x "$build_tools/zipalign" || ! -x "$build_tools/apksigner" ]]; then
            echo '::error::Android Build Tools 36.0.0 are not available.'
            exit 1
          fi
          echo "BUILD_TOOLS=$build_tools" >> "$GITHUB_ENV"

      - name: Download the APK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          url = os.environ['APK_URL']
          try:
              parsed = urlsplit(url)
              valid = (parsed.scheme in ('http', 'https') and parsed.hostname
                       and all(c.isprintable() and not c.isspace() for c in url))
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit('APK URL must be a valid HTTP(S) URL without whitespace.')
          PY
          # Do not echo a URL that might carry a private download token.
          echo "::add-mask::$APK_URL"
          curl --fail --location --retry 3 --silent --show-error \
            --proto '=http,https' --proto-redir '=http,https' \
            --connect-timeout 30 --max-time 1800 \
            "$APK_URL" --output "$RUNNER_TEMP/input.apk"
          sha256sum "$RUNNER_TEMP/input.apk" > "$RUNNER_TEMP/apk-sha256.txt"
          cat "$RUNNER_TEMP/apk-sha256.txt"
          ls -l "$RUNNER_TEMP/input.apk"
          python3 - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import PurePosixPath

          path = os.path.join(os.environ['RUNNER_TEMP'], 'input.apk')
          try:
              with zipfile.ZipFile(path) as apk:
                  if 'AndroidManifest.xml' not in apk.namelist():
                      raise ValueError('AndroidManifest.xml is missing')
                  for entry in apk.infolist():
                      parts = PurePosixPath(entry.filename.replace('\\', '/'))
                      if (parts.is_absolute() or '..' in parts.parts
                              or any(part.lower() == '.git' for part in parts.parts)
                              or stat.S_ISLNK(entry.external_attr >> 16)):
                          raise ValueError('the archive contains an unsafe file path')
          except (OSError, zipfile.BadZipFile, ValueError) as exc:
              raise SystemExit(f'Download is not a safe APK: {exc}')
          PY

      - name: Record the original signing certificate
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/input.apk"
          # The certificate this app used to report as its "vi" fingerprint.
          "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" \
            > "$RUNNER_TEMP/certs.txt" 2>&1 || true
          sha1="$(sed -n 's/.*certificate SHA-1 digest: \([^ ]*\).*/\1/p' \
            "$RUNNER_TEMP/certs.txt" | head -n1 | tr -d ':' | tr 'A-F' 'a-f')"
          printf '%s' "$sha1" > "$RUNNER_TEMP/original-sha1.txt"
          echo "::notice::original certificate SHA-1: ${sha1:-unknown}"
          echo "sha256: $(awk '{print $1}' "$RUNNER_TEMP/apk-sha256.txt")"
          # aapt is only for the summary; the authoritative identity check runs
          # on the decoded project, where no build tool is needed.
          {
            echo '### Original APK'
            echo
            echo '```'
            head -n 3 "$RUNNER_TEMP/apk-sha256.txt"
            cat "$RUNNER_TEMP/certs.txt"
            if [[ -x "$BUILD_TOOLS/aapt" ]]; then
              "$BUILD_TOOLS/aapt" dump badging "$apk" 2>/dev/null \
                | grep -E '^(package|sdkVersion|targetSdkVersion|application-label):' || true
            fi
            echo '```'
            echo
            echo "Original certificate SHA-1: \`${sha1:-unknown}\`"
            echo
            echo 'Nothing sends it any more, so it is recorded only in case'
            echo 'patch_movien.py:ORIGINAL_CERT_SHA1 is ever needed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decode all APK sources and resources
        run: |
          set -euo pipefail
          java -jar "$RUNNER_TEMP/apktool.jar" decode --all-src \
            --output "$RUNNER_TEMP/decoded-apk" "$RUNNER_TEMP/input.apk"
          test -f "$RUNNER_TEMP/decoded-apk/apktool.yml"
          test -f "$RUNNER_TEMP/decoded-apk/AndroidManifest.xml"

      - name: Compare the fresh decompile with the branch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/branch"
          git archive HEAD -- "$APP_FOLDER" | tar -x -C "$RUNNER_TEMP/branch"
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          folder = os.environ['APP_FOLDER']
          branch = temp / 'branch' / folder
          fresh = temp / 'decoded-apk'

          def fail(message):
              # Actions log downloads are blocked for this repo's sandbox, so
              # the diagnosis has to live in the annotation, not the log.
              print("::error::" + message.replace("\n", " ")[:900])
              raise SystemExit(1)

          # Identity, checked on the decompiled project so it needs no aapt.
          manifest = (fresh / 'AndroidManifest.xml').read_text(
              encoding='utf-8', errors='replace')
          package = re.search(r'\bpackage="([^"]+)"', manifest)
          yml = (fresh / 'apktool.yml').read_text(encoding='utf-8', errors='replace')
          version = re.search(r'versionName:\s*(\S+)', yml)
          if not package or package.group(1) != os.environ['EXPECTED_PACKAGE']:
              fail(f'Decoded package is {package and package.group(1)!r}, not '
                   f'{os.environ["EXPECTED_PACKAGE"]!r}: wrong download.')
          if not version or version.group(1) != os.environ['EXPECTED_VERSION_NAME']:
              fail(f'Decoded versionName is {version and version.group(1)!r}, not '
                   f'{os.environ["EXPECTED_VERSION_NAME"]!r}: wrong download.')
          print(f'Decoded {package.group(1)} {version.group(1)}')

          # Only these files may differ: the scripts rewrite exactly them, so
          # the branch must equal the pristine decompile plus their edits.
          def listed(*args):
              out = subprocess.run(['python3', *args], capture_output=True, text=True)
              if out.returncode != 0:
                  fail(f'{args[0]} {args[-1]} failed: {out.stderr.strip()}')
              return out.stdout.split()

          owned = set(listed('.rebuild/patch_movien.py', '--print-targets'))
          owned |= set(listed('.rebuild/signature_kill.py', folder, '--print-targets'))
          # Apktool keeps the signature block it was handed and stamps its own
          # version; neither says anything about the app.
          ignored = ('original/', 'META-INF/')

          report = subprocess.run(['diff', '-rq', str(branch), str(fresh)],
                                  capture_output=True, text=True)
          differing = []
          for line in report.stdout.splitlines():
              match = re.fullmatch(r'Files (.*) and .* differ', line)
              if match:
                  differing.append((str(Path(match.group(1)).relative_to(branch)),
                                    'differs'))
                  continue
              match = re.fullmatch(r'Only in (.*?): (.*)', line)
              if match:
                  base, name = Path(match.group(1)), match.group(2)
                  root = branch if base == branch else fresh
                  side = ('missing from the decompile' if base == branch
                          else 'new in the decompile')
                  top = base / name
                  # diff -rq collapses a directory that is absent on one side
                  # into a single line, which would hide an ignore prefix like
                  # original/, so list its files instead.
                  if top.is_dir():
                      for extra in sorted(top.rglob('*')):
                          if extra.is_file():
                              differing.append(
                                  (str(extra.relative_to(root)), side))
                  else:
                      differing.append((str(base.relative_to(root) / name), side))
                  continue
              print(f'::warning::unparsed diff output: {line}')

          unexpected = sorted(rel for rel, _ in differing
                               if rel not in owned and not rel.startswith(ignored))
          owned_hits = sorted(rel for rel, _ in differing if rel in owned)
          sample = ", ".join(f"{rel} ({side})" for rel, side in
                             sorted(differing) if rel in set(unexpected))
          print(f'::notice::MOVIEN compare: {len(differing)} differ, '
                f'{len(owned_hits)} owned by .rebuild, {len(unexpected)} unexpected')
          for rel in unexpected[:40]:
              print(f'  unexpected: {rel}')

          if unexpected:
              detail = '\n'.join(f'* `{rel}` ({side})'
                                 for rel, side in sorted(differing)
                                 if rel in set(unexpected))[:3000]
              body = ('The download does not match this branch.\n\n' + detail)
          else:
              body = ('`MOVIEN/` is a faithful decompilation of the downloaded '
                      f'APK plus the {len(owned_hits)} file(s) `.rebuild` owns.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write(f'### Decompile vs branch\n\n{body}\n')

          if unexpected and os.environ['FORCE_REPLACE'] != '1':
              fail(f'{len(unexpected)} file(s) differ outside .rebuild, refusing to '
                   f'replace MOVIEN/; re-run with force_replace to accept. '
                   f'First: {sample[:600]}')
          PY

      - name: Install the fresh decompile in MOVIEN
        if: env.DRY_RUN != '1'
        run: |
          set -euo pipefail
          # GitHub rejects single files over 100 MiB; this app has none, so
          # this only catches a surprise in a future build.
          big="$(find "$RUNNER_TEMP/decoded-apk" -type f -size +99M | head -5)"
          if [[ -n "$big" ]]; then
            echo "::error::Decoded file(s) exceed GitHub's 100 MiB limit: $big"
            exit 1
          fi
          rm -rf -- "$APP_FOLDER"
          mv -- "$RUNNER_TEMP/decoded-apk" "$APP_FOLDER"
          test -f "$APP_FOLDER/apktool.yml"

      - name: Remove the signature verification
        if: env.DRY_RUN != '1'
        run: |
          set -euo pipefail
          # The CI equivalent of the ticked Apktool M options; see the module
          # for why these two smali edits are the whole check for this app.
          python3 .rebuild/signature_kill.py "$APP_FOLDER" | tee "$RUNNER_TEMP/kill.txt"
          echo "::notice::signature kill: $(head -n1 "$RUNNER_TEMP/kill.txt")"
          { echo '### Signature verification'; echo '```';
            cat "$RUNNER_TEMP/kill.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the patches
        if: env.DRY_RUN != '1'
        run: |
          set -euo pipefail
          # Fail closed: a missing anchor means the download is not the build
          # the scripts were written against, and a half-patched app is worse
          # than no build at all.
          python3 .rebuild/patch_movien.py | tee "$RUNNER_TEMP/patch.txt"
          echo "::notice::patches: $(head -n1 "$RUNNER_TEMP/patch.txt")"
          { echo '### Patches'; echo '```'; cat "$RUNNER_TEMP/patch.txt"; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Lint the patched smali
        if: env.DRY_RUN != '1'
        run: |
          set -euo pipefail
          if ! python3 .rebuild/lint_patched_smali.py; then
            echo '::error::Patched smali failed the register/structure lint.'
            exit 1
          fi

      - name: Rebuild the APK
        if: env.DRY_RUN != '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-work"
          if ! java -jar "$RUNNER_TEMP/apktool.jar" build "$APP_FOLDER" \
            --output "$RUNNER_TEMP/apk-work/unsigned.apk" \
            > "$RUNNER_TEMP/apk-work/build.log" 2>&1; then
            tail_output="$(tail -n 30 "$RUNNER_TEMP/apk-work/build.log" | tr '\n' ' ')"
            echo "::error::Apktool build failed: ${tail_output//$'\r'/ }"
            exit 1
          fi
          tail -n 20 "$RUNNER_TEMP/apk-work/build.log" || true
          test -s "$RUNNER_TEMP/apk-work/unsigned.apk"
          unzip -tq "$RUNNER_TEMP/apk-work/unsigned.apk"

      - name: Prepare the signing key
        if: env.DRY_RUN != '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::$secret is missing."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing-key.jks"
          test -s "$RUNNER_TEMP/signing-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/signing-key.jks" \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null

      - name: Align, sign and verify
        if: env.DRY_RUN != '1'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 \
            "$RUNNER_TEMP/apk-work/unsigned.apk" "$RUNNER_TEMP/apk-work/aligned.apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$RUNNER_TEMP/apk-work/aligned.apk"
          mkdir -p "$RUNNER_TEMP/signed-apk"
          signed_apk="$RUNNER_TEMP/signed-apk/${APP_FOLDER}-signed.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/signing-key.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$signed_apk" \
            "$RUNNER_TEMP/apk-work/aligned.apk"
          test -s "$signed_apk"
          # The certificate of *this* build, for the record: it differs from
          # the publisher's on purpose, and the app no longer reports either.
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$signed_apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$signed_apk"
          unzip -tq "$signed_apk"
          sha256sum "$signed_apk"
          echo "::notice::signed APK: $(stat -c %s "$signed_apk") bytes"

      - name: Upload only the signed APK
        if: env.DRY_RUN != '1'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/signed-apk/*-signed.apk
          if-no-files-found: error
          archive: false

      - name: Commit the refreshed source
        if: env.DRY_RUN != '1'
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != branch ]]; then
            echo '::error::Select a branch, not a tag, when running this workflow.'
            exit 1
          fi
          python3 .rebuild/patch_movien.py   # idempotent; the tree ends patched
          git add --all --force -- ":(literal)$APP_FOLDER"
          if git diff --cached --quiet; then
            echo 'MOVIEN/ already matches the official APK plus the patches.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          apk_sha="$(awk '{print $1}' "$RUNNER_TEMP/apk-sha256.txt" 2>/dev/null || echo unknown)"
          orig_sha="$(cat "$RUNNER_TEMP/original-sha1.txt" 2>/dev/null || echo unknown)"
          changed="$(git diff --cached --name-only | wc -l)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -F - <<MSG
          Refresh MOVIEN from the official ${EXPECTED_VERSION_NAME} APK

          Decompile of ${APK_URL##*/}, sha256 ${apk_sha}: signature verification
          removed (.rebuild/signature_kill.py), then the ads/premium/profile
          patches (.rebuild/patch_movien.py). ${changed} file(s) changed against
          the branch. The APK built in the same run is signed with the workflow
          key rather than the publisher's, which the app no longer reports.

          Original signing certificate SHA-1, for
          patch_movien.py:ORIGINAL_CERT_SHA1 (unused today): ${orig_sha}
          MSG
          echo "::notice::committed $changed file(s); pushing to $GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          printf 'Committed %s file(s) changed by the refresh.\n' "$changed" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-key.jks"
